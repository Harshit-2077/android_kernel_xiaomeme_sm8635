name: EvilTwin — Kernel + Wi-Fi Driver

on:
  push:
    branches:
      - lineage-23.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EvilTwin Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Patched Wi-Fi Driver Source
        uses: actions/checkout@v4
        with:
          repository: Raju-yeager/Eviltwin-drivers_kernel_xiaomi_sm8635-modules
          path: modules_src
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            git-lfs gnupg gperf libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop pahole dwarves python3 python3-pip \
            rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev zstd

      - name: Setup Neutron Clang
        id: clang
        run: |
          CLANG_DIR="$HOME/neutron-clang"
          mkdir -p "$CLANG_DIR"

          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            curl -fsSL \
              https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
              -o /tmp/antman
            chmod +x /tmp/antman
            (cd "$CLANG_DIR" && /tmp/antman -S)
          fi

          test -x "$CLANG_DIR/bin/clang"
          echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: eviltwin-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            eviltwin-${{ runner.os }}-${{ github.ref_name }}-
            eviltwin-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -z

      - name: Build Kernel, Wi-Fi Driver and ZIPs
        env:
          CLANG_DIR: ${{ steps.clang.outputs.clang_dir }}
          ZIP_PREFIX: EvilTwin
          ZIP_VERSION: v1.0
          KBUILD_BUILD_USER: Harshit-2077
          KBUILD_BUILD_HOST: EvilTwin
        run: |
          chmod +x scripts/ci/build-project.sh
          ./scripts/ci/build-project.sh base

      - name: Show Build Summary
        if: always()
        run: |
          echo "=== Artifacts ==="
          find dist -maxdepth 1 -type f -printf '%f (%s bytes)\n' 2>/dev/null || true

          echo "=== Kernel Build Errors ==="
          grep -n -C 3 -E \
            "(error:|fatal error:|undefined symbol|ld\.lld: error:)" \
            out/build.log out/wlan_build.log 2>/dev/null || true
            
      - name: Verify ZIPs
        run: |
          echo "=== ZIP files ==="
          find dist -maxdepth 1 -type f -name '*.zip' -print

          count=$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected 3 ZIPs, found $count"
            exit 1
          fi
          for file in dist/EvilTwin-base-v1.0-*.zip; do
            [ -f "$file" ] || continue
            mv "$file" "dist/Kernel-PocoF6-v1.0-${file##*v1.0-}"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EvilTwin-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/Image-*
            dist/Module.symvers-*
            dist/config-*
            out/build.log
            out/wlan_build.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: EvilTwin-${{ github.run_number }}
          path: release_files

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eviltwin-${{ github.run_number }}
          name: "EvilTwin Kernel — Build #${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release_files/dist/*.zip
