name: Build Lucy Kernel, DLKMs & Monitor Wi-Fi (Standalone)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'dist/**']
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Repository URL'
        required: true
        type: string
        default: 'https://github.com/Harshit-2077/android_kernel_xiaomi_sm8635.git'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        type: string
        default: 'lineage-23.2'
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        options:
          - none
          - Pre-release
          - Release
        default: none

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_KEY_STATIC: cache-Lucy-peridot-v1
  OUT_DIR: ${{ github.workspace }}/out
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Aggressive Cleanup (Maximize Build Space)
        run: |
          echo "::group::Cleanup space"
          (docker system prune -af && docker builder prune -af || true) &
          DIRS=(
            /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia*
            /usr/local/lib/android /usr/local/share/chromium /opt/microsoft /opt/google
            /opt/az /usr/local/share/powershell /opt/hostedtoolcache
          )
          printf "%s\0" "${DIRS[@]}" | xargs -0 -P 4 -n 1 sudo rm -rf
          wait
          df -h
          echo "::endgroup::"

      - name: Setup 16GB SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl e2fsprogs file flex git \
            libelf-dev libncurses-dev libssl-dev lld llvm pahole patch patchelf \
            python3 rsync unzip wget zip zstd device-tree-compiler \
            android-sdk-libsparse-utils mkbootimg

          curl -sL https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT | base64 -d | sudo tee /usr/local/bin/avbtool > /dev/null
          sudo chmod +x /usr/local/bin/avbtool

      - name: Setup Neutron Clang Toolchain
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "CLANG_DIR=$HOME/clang" >> "$GITHUB_ENV"

      - name: Clone Kernel Source & Kernel Kit
        run: |
          echo "Cloning kernel source..."
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_repo }}" "$GITHUB_WORKSPACE/kernel_src"
          
          echo "Cloning kernel_kit..."
          git clone --depth=1 https://github.com/Harshit-2077/kernel_kit.git "$GITHUB_WORKSPACE/kernel_kit"
          
          echo "KERNEL_KIT=$GITHUB_WORKSPACE/kernel_kit" >> "$GITHUB_ENV"

      - name: Restore Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OUT_DIR }}
          key: ${{ env.CACHE_KEY_STATIC }}

      - name: Build Kernel, DLKMs & Images
        shell: bash
        run: |
          set -euo pipefail
          FLAVOR="Lucy-monitor"
          ROOT="$GITHUB_WORKSPACE/kernel_src"
          OUT="$GITHUB_WORKSPACE/out"
          DIST="$GITHUB_WORKSPACE/dist"
          DYNAMIC_CACHE_DIR="$OUT/dynamic_cache"
          JOBS="$(nproc --all)"
          
          mkdir -p "$OUT" "$DIST" "$DYNAMIC_CACHE_DIR"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="Harshit-2077" KBUILD_BUILD_HOST="Lucy"
          
          export ROOT_DIR="$ROOT"
          export KERNEL_DIR="$ROOT" 
          export SOC="cliffs"
          export CODENAME="peridot"
          export OS_SHORT="los23.2"
          export QCACLD_DEV_NAME="qca6750"
          export DYNAMIC_CACHE_DIR="$DYNAMIC_CACHE_DIR"

          WARN_FLAGS="-Wno-error -Wno-gnu-zero-variadic-macro-arguments -Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-misleading-indentation -Wno-format"

          export CCACHE_DIR="$OUT/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -o compression=false
          ccache -M 5G

          cd "$ROOT"

          echo "::group::0. Fix OpenSSL 3.0 key_pass"
          if [[ -f "$ROOT/certs/extract-cert.c" ]]; then
            sed -i '/static.*key_pass/d' "$ROOT/certs/extract-cert.c"
            sed -i '1i __attribute__((unused)) static const char *key_pass;' "$ROOT/certs/extract-cert.c"
            echo "Patched certs/extract-cert.c for OpenSSL 3.0"
          fi
          echo "::endgroup::"

          echo "::group::1. Defconfig & Compile"
          
          MTIME_CACHE="$KERNEL_KIT/scripts/dynamic_mtime.sh"
          if [[ -f "$MTIME_CACHE" ]]; then
            chmod +x "$MTIME_CACHE"
            echo "::group::Restore File Timestamps (-t)"
            "$MTIME_CACHE" -t -d "$ROOT" -k kernel
            echo "::endgroup::"
          fi

          BUILD_CONFIG="$KERNEL_KIT/device/peridot-los23.2/build_config/build.config.peridot.los23.2"
          if [[ -f "$BUILD_CONFIG" ]]; then
            echo "Sourcing build config: $BUILD_CONFIG"
            set +u
            set -a
            source "$BUILD_CONFIG"
            set +a
            set -u
          else
            echo "::error::build.config not found!"
            exit 1
          fi

          if [[ -v CONFIGS_GKI ]]; then
            make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 "${CONFIGS_GKI[@]}"
          else
            make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          fi

          ./scripts/config --file "$OUT/.config" \
            --set-str LOCALVERSION "-Lucy-Monitor" -d LOCALVERSION_AUTO -d WERROR \
            --set-val UCLAMP_BUCKETS_COUNT 20 -d TASK_DELAY_ACCT -d RSEQ -d SCHED_CLUSTER \
            -e SCHED_MC -e SCHED_HRTICK -e RT_SOFTIRQ_AWARE_SCHED -e RCU_BOOST -e RCU_LAZY \
            -e RCU_LAZY_DEFAULT_OFF -e BOEFFLA_WL_BLOCKER -e UNWIND_TABLES -e UNWIND_PATCH_PAC_INTO_SCS \
            -e DYNAMIC_SCS -d HZ_100 -e HZ_250 -d HZ_300 -d HZ_1000 --set-val HZ 250 \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN -e CFI_CLANG \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL \
            -m MI_HARDWARE_ID -m RFKILL -m CFG80211 -e NL80211_TESTMODE \
            -e CFG80211_REQUIRE_SIGNED_REGDB -e CFG80211_USE_KERNEL_REGDB_KEYS \
            -e CFG80211_DEFAULT_PS -d CFG80211_CRDA_SUPPORT -d CFG80211_WEXT -m MAC80211
          
          if declare -f compile_system_dlkm_modules > /dev/null; then
            echo "Executing compile_system_dlkm_modules from build.config..."
            compile_system_dlkm_modules
          fi
          
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          if [[ -f "$MTIME_CACHE" ]]; then
            echo "::group::Find changes force recompilation (-u)"
            "$MTIME_CACHE" -u -d "$ROOT" -k kernel
            echo "::endgroup::"
          fi

          K_MAKE_FLAGS=("-j$JOBS" "O=$OUT" "ARCH=arm64" "LLVM=1" "LLVM_IAS=1" "CC=ccache clang" "HOSTCC=ccache clang" "HOSTCXX=ccache clang++" "KBUILD_MODPOST_WARN=1" "KCFLAGS=$WARN_FLAGS")
          if [[ -v MAKE_FLAGS ]]; then
             K_MAKE_FLAGS=("${MAKE_FLAGS[@]}")
          fi

          make "${K_MAKE_FLAGS[@]}" Image modules

          cp -f "$OUT/arch/arm64/boot/Image" "$DIST/Image-$FLAVOR"
          cp -f "$OUT/.config" "$DIST/config-$FLAVOR"

          make "${K_MAKE_FLAGS[@]}" INSTALL_MOD_PATH="$OUT/modules_staging" INSTALL_MOD_STRIP=1 modules_install
          cd "$OUT/modules_staging"
          UNAME=$(ls lib/modules/)
          depmod -b . "$UNAME"
          cd "$ROOT"
          echo "::endgroup::"

          echo "::group::2. Build system_dlkm & vendor_dlkm"
          
          # system_dlkm (Let mke2fs auto-calculate the size needed)
          SYS_STAGE="$OUT/system_dlkm_staging"
          rm -rf "$SYS_STAGE" && mkdir -p "$SYS_STAGE/lib/modules/$UNAME"
          SYS_LIST="$KERNEL_KIT/device/peridot-los23.2/system_dlkm/system_dlkm.modules.include"
          if [[ -f "$SYS_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$SYS_STAGE/lib/modules/$UNAME/"
            done < "$SYS_LIST"
          else
            echo "WARNING: system_dlkm.modules.include not found, copying all modules."
            find "$OUT/modules_staging/lib/modules/$UNAME" -name "*.ko" -exec cp {} "$SYS_STAGE/lib/modules/$UNAME/" \;
          fi
          cp "$OUT/modules_staging/lib/modules/$UNAME/modules."{alias,dep,softdep} "$SYS_STAGE/lib/modules/$UNAME/" 2>/dev/null || true
          
          # Omit the size argument, mke2fs will use the exact block count required
          mke2fs -t ext4 -d "$SYS_STAGE" "$DIST/system_dlkm.img"
          # Omit --partition_size for dynamic partitions
          avbtool add_hashtree_footer --partition_name system_dlkm --hash_algorithm sha256 --image "$DIST/system_dlkm.img" --do_not_generate_fec

          # vendor_dlkm (Let mke2fs auto-calculate the size needed)
          VEND_STAGE="$OUT/vendor_dlkm_staging"
          rm -rf "$VEND_STAGE" && mkdir -p "$VEND_STAGE/lib/modules/$UNAME"
          VEND_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_dlkm/vendor_dlkm.modules.include"
          if [[ -f "$VEND_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$VEND_STAGE/lib/modules/$UNAME/"
            done < "$VEND_LIST"
          else
            echo "WARNING: vendor_dlkm.modules.include not found, copying all modules."
            find "$OUT/modules_staging/lib/modules/$UNAME" -name "*.ko" -exec cp {} "$VEND_STAGE/lib/modules/$UNAME/" \;
          fi
          cp "$OUT/modules_staging/lib/modules/$UNAME/modules."{alias,dep,softdep} "$VEND_STAGE/lib/modules/$UNAME/" 2>/dev/null || true
          
          # Omit the size argument
          mke2fs -t ext4 -d "$VEND_STAGE" "$DIST/vendor_dlkm.img"
          # Omit --partition_size
          avbtool add_hashtree_footer --partition_name vendor_dlkm --hash_algorithm sha256 --image "$DIST/vendor_dlkm.img" --do_not_generate_fec
          echo "::endgroup::"

          echo "::group::3. OOT WLAN Module Build"
          git clone --depth=1 --branch lineage-23.2 "https://github.com/Harshit-2077/android_kernel_xiaomi_sm8635-modules.git" "$GITHUB_WORKSPACE/modules_src"
          WLAN_DIR="$GITHUB_WORKSPACE/modules_src/qcom/opensource/wlan"
          QCACLD_DIR="$WLAN_DIR/qcacld-3.0"
          ln -sfn ../qca-wifi-host-cmn "$QCACLD_DIR/cmn"

          for dcfg in "$QCACLD_DIR/configs/"*qca6750* "$QCACLD_DIR/configs/default_defconfig"; do
            [[ -f "$dcfg" ]] && { sed -i '/CONFIG_FEATURE_MONITOR_MODE_SUPPORT/d' "$dcfg"; echo "CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y" >> "$dcfg"; }
          done

          export KBUILD_EXTRA_SYMBOLS="$OUT/Module.symvers"
          make -j"$JOBS" -C "$ROOT" O="$OUT" \
            M="$QCACLD_DIR" \
            CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
            WLAN_ROOT="$QCACLD_DIR" WLAN_COMMON_ROOT=cmn WLAN_COMMON_INC="$QCACLD_DIR/cmn" \
            WLAN_FW_API="$WLAN_DIR/fw-api/" CONFIG_ARCH_CLIFFS=y CONFIG_ARCH_QCOM=y \
            CONFIG_CNSS_OUT_OF_TREE=y CONFIG_IPA_OUT_OF_TREE=y CONFIG_QCA_WIFI_ISOC=0 \
            CONFIG_QCA_WIFI_2_0=1 WLAN_PROFILE=qca6750 CONFIG_QCA_CLD_WLAN_PROFILE=qca6750 \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y DYNAMIC_SINGLE_CHIP=qca6750 DEVNAME=qca6750 \
            MODNAME=qca_cld3_qca6750 CONFIG_QCA_CLD_WLAN=m \
            KCFLAGS="$WARN_FLAGS -DFEATURE_MONITOR_MODE_SUPPORT -DCONFIG_FEATURE_MONITOR_MODE_SUPPORT=1" \
            modules 2>&1 | tee "$OUT/wlan_build.log"
          
          llvm-strip --strip-debug "$QCACLD_DIR/qca_cld3_qca6750.ko"
          echo "::endgroup::"

          echo "::group::4. Vendor Boot Image"
          VB_RAMDISK_DIR="$OUT/vendor_boot_ramdisk"
          mkdir -p "$VB_RAMDISK_DIR/lib/modules/$UNAME"
          cp "$QCACLD_DIR/qca_cld3_qca6750.ko" "$VB_RAMDISK_DIR/lib/modules/$UNAME/"

          VB_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/vendor_boot.modules.include"
          if [[ -f "$VB_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$VB_RAMDISK_DIR/lib/modules/$UNAME/"
            done < "$VB_LIST"
          fi

          if [[ -d "$KERNEL_KIT/device/peridot-los23.2/vendor_boot/ramdisk" ]]; then
             cp -r "$KERNEL_KIT/device/peridot-los23.2/vendor_boot/ramdisk/"* "$VB_RAMDISK_DIR/"
          fi

          depmod -b "$VB_RAMDISK_DIR" "$UNAME"
          
          (cd "$VB_RAMDISK_DIR" && find . | cpio -o -H newc | gzip -9 > "$DIST/ramdisk.img")

          DTB_FILE="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/dtb"
          BOOTCONFIG="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/bootconfig"
          
          mkbootimg --header_version 4 \
            --vendor_cmdline "bootconfig" \
            --vendor_ramdisk "$DIST/ramdisk.img" \
            --dtb "$DTB_FILE" \
            --vendor_bootconfig "$BOOTCONFIG" \
            --vendor_boot "$DIST/vendor_boot.img"

          # Vendor boot IS a physical partition, so we use the exact size from your JSON (96MB)
          avbtool add_hash_footer --partition_name vendor_boot --partition_size 100663296 --image "$DIST/vendor_boot.img" --algorithm SHA256_RSA4096 --key "$KERNEL_KIT/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem" 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::5. Packaging Artifacts"
          STAGE="$(mktemp -d)"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$STAGE"
          rm -rf "$STAGE/.git"
          sed -i 's/device.name1=.*/device.name1=peridot/g; s/device.name2=.*/device.name2=pineapple/g; s/BLOCK=.*/BLOCK=auto;/g; s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g' "$STAGE/anykernel.sh"

          cp -f "$OUT/arch/arm64/boot/Image" "$STAGE/Image"
          cp -f "$QCACLD_DIR/qca_cld3_qca6750.ko" "$STAGE/"

          cat << 'AKEOF' >> "$STAGE/anykernel.sh"
          if [ -f "$AKHOME/qca_cld3_qca6750.ko" ]; then
              for Lucy_tgt in /vendor_dlkm/lib/modules/qca_cld3_qca6750.ko /vendor/lib/modules/qca_cld3_qca6750.ko; do
                  Lucy_tdir=$(dirname "$Lucy_tgt")
                  if [ -d "$Lucy_tdir" ]; then
                      mount -o rw,remount "$(echo "$Lucy_tgt" | cut -d/ -f1-2)" 2>/dev/null || true
                      cp -f "$AKHOME/qca_cld3_qca6750.ko" "$Lucy_tgt" 2>/dev/null && \
                      { chmod 644 "$Lucy_tgt"; chown 0:0 "$Lucy_tgt"; restorecon "$Lucy_tgt" 2>/dev/null; break; }
                  fi
              done
          fi
          AKEOF

          (cd "$STAGE" && zip -r9q "$DIST/Lucy-Monitor-${FLAVOR}-$(date -u +%Y%m%d)-$(cd "$ROOT" && git rev-parse --short=7 HEAD).zip" .)
          rm -rf "$STAGE"
          echo "::endgroup::"

      - name: Fetch NetHunter Wireless Firmware
        run: |
          mkdir -p dist
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/Magisk-Modules-Repo/wirelessFirmware/releases/latest/download/wirelessFirmware.zip" || \
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/rithvikvibhu/nh-magisk-wifi-firmware/archive/refs/heads/master.zip"

      - name: Delete Old Build Cache
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete "${{ env.CACHE_KEY_STATIC }}" || true

      - name: Save New Build Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OUT_DIR }}
          key: ${{ env.CACHE_KEY_STATIC }}

      - name: Upload Build Artifacts (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-SM8635-Packages-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.img
            dist/Image-*
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.release_type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          BASE_TAG="Lucy-peridot"
          LATEST_N=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' \
            | grep -E "^${BASE_TAG}-r[0-9]+$" \
            | grep -oE '[0-9]+$' \
            | sort -n | tail -n1 || true)

          if [ -z "${LATEST_N}" ]; then
            NEW_TAG="${BASE_TAG}-r0"
          else
            NEW_TAG="${BASE_TAG}-r$((LATEST_N + 1))"
          fi

          echo "Creating release: ${NEW_TAG}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          PRE_FLAG=""
          if [[ "${{ inputs.release_type }}" == "Pre-release" ]]; then
            PRE_FLAG="--prerelease"
          fi

          gh release create "${NEW_TAG}" \
            --repo "${{ github.repository }}" \
            --title "Lucy Monitor Kernel (${NEW_TAG})" \
            --notes "Automated build for POCO F6 (peridot). Includes Monitor Mode Wi-Fi support and NetHunter firmware." \
            ${PRE_FLAG}

          gh release upload "${NEW_TAG}" dist/*.zip dist/*.img --repo "${{ github.repository }}" --clobber

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-Build-Logs-Debug
          path: out/*.log
          if-no-files-found: ignore
