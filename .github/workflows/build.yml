name: Build Lucy Kernel, DLKMs & Monitor Wi-Fi

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'dist/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Maximize Build Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl file flex git libelf-dev \
            libncurses-dev libssl-dev lld llvm pahole patch patchelf \
            python3 rsync unzip wget zip zstd device-tree-compiler \
            android-sdk-libsparse-utils mkbootimg

          curl -sL https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT | base64 -d | sudo tee /usr/local/bin/avbtool > /dev/null
          sudo chmod +x /usr/local/bin/avbtool

          curl -sL https://android.googlesource.com/kernel/build/+/refs/heads/main/build_utils.sh?format=TEXT | base64 -d > build_utils.sh
          chmod +x build_utils.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: Lucy-sm8635-ccache-v1
          max-size: 2G

      - name: Setup Neutron Clang Toolchain
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "CLANG_DIR=$HOME/clang" >> "$GITHUB_ENV"

      - name: Fetch Kernel Kit (Device Files & Scripts)
        run: |
          git clone --depth=1 https://github.com/Harshit-2077/kernel_kit.git "$GITHUB_WORKSPACE/kernel_kit"
          export KERNEL_KIT="$GITHUB_WORKSPACE/kernel_kit"
          echo "KERNEL_KIT=$KERNEL_KIT" >> "$GITHUB_ENV"

      - name: Build Kernel & DLKMs
        shell: bash
        run: |
          set -euo pipefail
          FLAVOR="Lucy-monitor"
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="Harshit-2077" KBUILD_BUILD_HOST="Lucy"

          OUT="$ROOT/out"; DIST="$ROOT/dist"; JOBS="$(nproc --all)"
          rm -rf "$OUT" "$DIST"; mkdir -p "$OUT" "$DIST"
          WARN_FLAGS="-Wno-error -Wno-gnu-zero-variadic-macro-arguments -Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-misleading-indentation -Wno-format"

          # 1. Defconfig & Feature Enabling
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          for frag in arch/arm64/configs/vendor/pineapple_GKI.config \
                      arch/arm64/configs/vendor/peridot_GKI.config; do
            [[ -f "$frag" ]] && ARCH=arm64 scripts/kconfig/merge_config.sh -m -O "$OUT" "$OUT/.config" "$frag"
          done

          ./scripts/config --file "$OUT/.config" \
            --set-str LOCALVERSION "-Lucy-Monitor" -d LOCALVERSION_AUTO -d WERROR \
            --set-val UCLAMP_BUCKETS_COUNT 20 -d TASK_DELAY_ACCT -d RSEQ -d SCHED_CLUSTER \
            -e SCHED_MC -e SCHED_HRTICK -e RT_SOFTIRQ_AWARE_SCHED -e RCU_BOOST -e RCU_LAZY \
            -e RCU_LAZY_DEFAULT_OFF -e BOEFFLA_WL_BLOCKER -e UNWIND_TABLES -e UNWIND_PATCH_PAC_INTO_SCS \
            -e DYNAMIC_SCS -d HZ_100 -e HZ_250 -d HZ_300 -d HZ_1000 --set-val HZ 250 \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN -e CFI_CLANG \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL \
            -m MI_HARDWARE_ID -m RFKILL -m CFG80211 -e NL80211_TESTMODE \
            -e CFG80211_REQUIRE_SIGNED_REGDB -e CFG80211_USE_KERNEL_REGDB_KEYS \
            -e CFG80211_DEFAULT_PS -d CFG80211_CRDA_SUPPORT -d CFG80211_WEXT -m MAC80211
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # 2. Build Kernel Image and in-tree modules
          make -j"$JOBS" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
            KBUILD_MODPOST_WARN=1 KCFLAGS="$WARN_FLAGS" \
            Image modules

          cp -f "$OUT/arch/arm64/boot/Image" "$DIST/Image-$FLAVOR"
          cp -f "$OUT/.config" "$DIST/config-$FLAVOR"

          make -j"$JOBS" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH="$OUT/modules_staging" INSTALL_MOD_STRIP=1 modules_install
          cd "$OUT/modules_staging"
          UNAME=$(ls lib/modules/)
          depmod -b . "$UNAME"

          # 3. Build Dynamic Kernel Modules (DLKMs) using kernel_kit device files
          # system_dlkm
          SYS_STAGE="$OUT/system_dlkm_staging"
          mkdir -p "$SYS_STAGE/lib/modules/$UNAME"
          SYS_LIST="$KERNEL_KIT/device/peridot-los23.2/system_dlkm/system_dlkm.modules.include"
          if [[ -f "$SYS_LIST" ]]; then
            while IFS= read -r mod; do
              [[ -z "$mod" ]] && continue
              find lib/modules/$UNAME -name "$mod" -exec cp {} "$SYS_STAGE/lib/modules/$UNAME/" \;
            done < "$SYS_LIST"
          else
            echo "WARNING: system_dlkm.modules.include not found, copying all modules"
            find lib/modules/$UNAME -name "*.ko" -exec cp {} "$SYS_STAGE/lib/modules/$UNAME/" \;
          fi
          cp lib/modules/$UNAME/modules.{alias,dep,softdep} "$SYS_STAGE/lib/modules/$UNAME/" 2>/dev/null || true
          bash "$ROOT/build_utils.sh" build_image "$SYS_STAGE" "" "$DIST/system_dlkm.img" /dev/null 2>/dev/null || \
            make_ext4fs -s -l 64M -a system_dlkm "$DIST/system_dlkm.img" "$SYS_STAGE"
          avbtool add_hashtree_footer --partition_name system_dlkm --hash_algorithm sha256 --image "$DIST/system_dlkm.img" --do_not_generate_fec

          # vendor_dlkm
          VEND_STAGE="$OUT/vendor_dlkm_staging"
          mkdir -p "$VEND_STAGE/lib/modules/$UNAME"
          VEND_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_dlkm/vendor_dlkm.modules.include"
          if [[ -f "$VEND_LIST" ]]; then
            while IFS= read -r mod; do
              [[ -z "$mod" ]] && continue
              find lib/modules/$UNAME -name "$mod" -exec cp {} "$VEND_STAGE/lib/modules/$UNAME/" \;
            done < "$VEND_LIST"
          else
            find lib/modules/$UNAME -name "*.ko" -exec cp {} "$VEND_STAGE/lib/modules/$UNAME/" \;
          fi
          cp lib/modules/$UNAME/modules.{alias,dep,softdep} "$VEND_STAGE/lib/modules/$UNAME/" 2>/dev/null || true
          bash "$ROOT/build_utils.sh" build_image "$VEND_STAGE" "" "$DIST/vendor_dlkm.img" /dev/null 2>/dev/null || \
            make_ext4fs -s -l 64M -a vendor_dlkm "$DIST/vendor_dlkm.img" "$VEND_STAGE"
          avbtool add_hashtree_footer --partition_name vendor_dlkm --hash_algorithm sha256 --image "$DIST/vendor_dlkm.img" --do_not_generate_fec

          # 4. Out-of-Tree (OOT) WLAN Module Build
          PATCHED_MODULES_REPO="https://github.com/Harshit-2077/android_kernel_xiaomi_sm8635-modules.git"
          rm -rf "$ROOT/modules_src"
          git clone --depth=1 --branch lineage-23.2 "$PATCHED_MODULES_REPO" "$ROOT/modules_src"

          WLAN_DIR="$ROOT/modules_src/qcom/opensource/wlan"
          QCACLD_DIR="$WLAN_DIR/qcacld-3.0"
          ln -sfn ../qca-wifi-host-cmn "$QCACLD_DIR/cmn"

          for dcfg in "$QCACLD_DIR/configs/"*qca6750* "$QCACLD_DIR/configs/default_defconfig"; do
            [[ -f "$dcfg" ]] && { sed -i '/CONFIG_FEATURE_MONITOR_MODE_SUPPORT/d' "$dcfg"; echo "CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y" >> "$dcfg"; }
          done

          export KBUILD_EXTRA_SYMBOLS="$OUT/Module.symvers"

          make -j"$JOBS" -C "$ROOT" O="$OUT" \
            M="$QCACLD_DIR" \
            CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
            WLAN_ROOT="$QCACLD_DIR" WLAN_COMMON_ROOT=cmn WLAN_COMMON_INC="$QCACLD_DIR/cmn" \
            WLAN_FW_API="$WLAN_DIR/fw-api/" CONFIG_ARCH_PINEAPPLE=y CONFIG_ARCH_QCOM=y \
            CONFIG_CNSS_OUT_OF_TREE=y CONFIG_IPA_OUT_OF_TREE=y CONFIG_QCA_WIFI_ISOC=0 \
            CONFIG_QCA_WIFI_2_0=1 WLAN_PROFILE=qca6750 CONFIG_QCA_CLD_WLAN_PROFILE=qca6750 \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y DYNAMIC_SINGLE_CHIP=qca6750 DEVNAME=qca6750 \
            MODNAME=qca_cld3_qca6750 CONFIG_QCA_CLD_WLAN=m \
            KCFLAGS="$WARN_FLAGS -DFEATURE_MONITOR_MODE_SUPPORT -DCONFIG_FEATURE_MONITOR_MODE_SUPPORT=1" \
            modules 2>&1 | tee "$OUT/wlan_build.log"

          llvm-strip --strip-debug "$QCACLD_DIR/qca_cld3_qca6750.ko"

          # 5. Vendor Boot Image Construction using kernel_kit
          VB_RAMDISK_DIR="$OUT/vendor_boot_ramdisk"
          mkdir -p "$VB_RAMDISK_DIR/lib/modules/$UNAME"
          cp "$QCACLD_DIR/qca_cld3_qca6750.ko" "$VB_RAMDISK_DIR/lib/modules/$UNAME/"

          VB_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/vendor_boot.modules.include"
          if [[ -f "$VB_LIST" ]]; then
            while IFS= read -r mod; do
              [[ -z "$mod" ]] && continue
              find "$OUT/modules_staging/lib/modules/$UNAME" -name "$mod" -exec cp {} "$VB_RAMDISK_DIR/lib/modules/$UNAME/" \;
            done < "$VB_LIST"
          fi

          depmod -b "$VB_RAMDISK_DIR" "$UNAME"
          mkbootfs "$VB_RAMDISK_DIR" | gzip -c > "$DIST/ramdisk.img"

          DTB_FILE="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/dtb"
          BOOTCONFIG="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/bootconfig"
          CMDLINE_FILE="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/cmdline.txt"
          if [[ -f "$CMDLINE_FILE" ]]; then
            VENDOR_CMDLINE=$(cat "$CMDLINE_FILE")
          else
            VENDOR_CMDLINE="bootconfig"
          fi

          mkbootimg --header_version 4 \
            --vendor_cmdline "$VENDOR_CMDLINE" \
            --vendor_ramdisk "$DIST/ramdisk.img" \
            --dtb "$DTB_FILE" \
            --vendor_bootconfig "$BOOTCONFIG" \
            --vendor_boot "$DIST/vendor_boot.img" 2>/dev/null || \
          mkbootimg --header_version 4 \
            --vendor_ramdisk "$DIST/ramdisk.img" \
            --dtb "$DTB_FILE" \
            --vendor_boot "$DIST/vendor_boot.img"

          avbtool add_hash_footer --partition_name vendor_boot --partition_size 100663296 --image "$DIST/vendor_boot.img" --algorithm SHA256_RSA4096 --key "$KERNEL_KIT/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem" 2>/dev/null || true

          # 6. Packaging AnyKernel3 Zip
          STAGE="$(mktemp -d)"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$STAGE"
          rm -rf "$STAGE/.git"
          sed -i 's/device.name1=.*/device.name1=peridot/g; s/device.name2=.*/device.name2=pineapple/g; s/BLOCK=.*/BLOCK=auto;/g; s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g' "$STAGE/anykernel.sh"

          cp -f "$OUT/arch/arm64/boot/Image" "$STAGE/Image"
          cp -f "$QCACLD_DIR/qca_cld3_qca6750.ko" "$STAGE/"

          cat << 'AKEOF' >> "$STAGE/anykernel.sh"
          if [ -f "$AKHOME/qca_cld3_qca6750.ko" ]; then
              for Lucy_tgt in /vendor_dlkm/lib/modules/qca_cld3_qca6750.ko /vendor/lib/modules/qca_cld3_qca6750.ko; do
                  Lucy_tdir=$(dirname "$Lucy_tgt")
                  if [ -d "$Lucy_tdir" ]; then
                      mount -o rw,remount "$(echo "$Lucy_tgt" | cut -d/ -f1-2)" 2>/dev/null || true
                      cp -f "$AKHOME/qca_cld3_qca6750.ko" "$Lucy_tgt" 2>/dev/null && \
                      { chmod 644 "$Lucy_tgt"; chown 0:0 "$Lucy_tgt"; restorecon "$Lucy_tgt" 2>/dev/null; break; }
                  fi
              done
          fi
          AKEOF

          (cd "$STAGE" && zip -r9q "$DIST/Lucy-Monitor-${FLAVOR}-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD).zip" .)
          rm -rf "$STAGE"

      - name: Fetch NetHunter Wireless Firmware
        run: |
          mkdir -p dist
          # Download the community NetHunter wireless firmware Magisk module
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/Magisk-Modules-Repo/wirelessFirmware/releases/latest/download/wirelessFirmware.zip" || \
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/rithvikvibhu/nh-magisk-wifi-firmware/archive/refs/heads/master.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-SM8635-Packages-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.img
            dist/Image-*
          if-no-files-found: error

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-Build-Logs-Debug
          path: out/*.log
          if-no-files-found: ignore
