name: Build Radium Kernel & Monitor Wi-Fi

on:
  push:
    branches: [ "17", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Maximize Build Space & Add 8GB Swap (Prevents Exit 143 OOM)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl file flex git libelf-dev \
            libncurses-dev libssl-dev lld llvm pahole patch patchelf \
            python3 rsync unzip wget zip zstd

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: radium-sm8635-ccache
          max-size: 2G

      - name: Setup Neutron Clang Toolchain (with glibc 2.39 patch)
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "CLANG_DIR=$HOME/clang" >> "$GITHUB_ENV"

      - name: Run Build Script
        run: |
          chmod +x scripts/ci/build.sh
          ./scripts/ci/build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Radium-SM8635-Packages-${{ github.sha }}
          path: |
            dist/*.zip
            dist/Image-*
          if-no-files-found: error

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Radium-Build-Logs-Debug
          path: |
            out/*.log
          if-no-files-found: ignore
