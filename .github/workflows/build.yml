name: Build Lucy Kernel, DLKMs & Monitor Wi-Fi (Standalone)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'dist/**']
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Repository URL'
        required: true
        type: string
        default: 'https://github.com/Harshit-2077/android_kernel_xiaomeme_sm8635.git'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        type: string
        default: 'lineage-23.2'
      compile_dlkm:
        description: 'Build DLKMs, Modules & Boot Images (Uncheck for Kernel Image Only)'
        required: true
        type: boolean
        default: true
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        options:
          - none
          - Pre-release
          - Release
        default: none

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_KEY_STATIC: cache-Lucy-peridot-v1
  KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/Harshit-2077/android_kernel_xiaomeme_sm8635.git' }}
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-23.2' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # Global Paths (Available to all steps)
  FLAVOR: "Lucy-monitor"
  ROOT: "${{ github.workspace }}/kernel_src"
  ROOT_DIR: "${{ github.workspace }}/kernel_src"
  KERNEL_DIR: "."  # FIX: Tells build.config the kernel is at the root
  OUT: "${{ github.workspace }}/out"
  DIST: "${{ github.workspace }}/dist"
  DYNAMIC_CACHE_DIR: "${{ github.workspace }}/out/dynamic_cache"
  KERNEL_KIT: "${{ github.workspace }}/kernel_kit"
  
  # Build Variables
  SOC: "cliffs"
  CODENAME: "peridot"
  OS_SHORT: "los23.2"
  QCACLD_DEV_NAME: "qca6750"
  TARGET_BOARD_PLATFORM: "cliffs"
  BOARD_PLATFORM: "cliffs"
  
  WARN_FLAGS: "-Wno-error -Wno-gnu-zero-variadic-macro-arguments -Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-misleading-indentation -Wno-format"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Aggressive Cleanup (Maximize Build Space)
        run: |
          echo "::group::Cleanup space"
          (docker system prune -af && docker builder prune -af || true) &
          DIRS=(
            /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia*
            /usr/local/lib/android /usr/local/share/chromium /opt/microsoft /opt/google
            /opt/az /usr/local/share/powershell /opt/hostedtoolcache
          )
          printf "%s\0" "${DIRS[@]}" | xargs -0 -P 4 -n 1 sudo rm -rf
          wait
          df -h
          echo "::endgroup::"

      - name: Setup 16GB SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl e2fsprogs file flex git \
            libelf-dev libncurses-dev libssl-dev lld llvm pahole patch patchelf \
            python3 rsync unzip wget zip zstd device-tree-compiler \
            android-sdk-libsparse-utils mkbootimg

          curl -sL https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT | base64 -d | sudo tee /usr/local/bin/avbtool > /dev/null
          sudo chmod +x /usr/local/bin/avbtool

      - name: Setup Neutron Clang Toolchain
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "CLANG_DIR=$HOME/clang" >> "$GITHUB_ENV"

      - name: Clone Kernel Source & Kernel Kit
        run: |
          echo "Cloning kernel source from $KERNEL_REPO ($KERNEL_BRANCH)..."
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$ROOT"

          echo "Cloning kernel_kit..."
          git clone --depth=1 https://github.com/Harshit-2077/kernel_kit.git "$KERNEL_KIT"
          
          echo "Cloning Modules Source..."
          git clone --depth=1 --branch lineage-23.2 "https://github.com/Harshit-2077/android_kernel_xiaomi_sm8635-modules.git" "$GITHUB_WORKSPACE/modules_src"
          
          # Create symlink so the directory structure matches standard AOSP expectations for vendor modules
          ln -sfn "$GITHUB_WORKSPACE/modules_src" "$GITHUB_WORKSPACE/vendor"

      - name: Restore Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OUT }}
          key: ${{ env.CACHE_KEY_STATIC }}

      - name: Build Kernel (Image & In-Tree Modules)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$DIST" "$DYNAMIC_CACHE_DIR"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="Harshit-2077" KBUILD_BUILD_HOST="Lucy"
          
          export CCACHE_DIR="$OUT/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -o compression=false
          ccache -M 5G

          cd "$ROOT"

          echo "::group::0. Fix OpenSSL 3.0 key_pass"
          if [[ -f "$ROOT/certs/extract-cert.c" ]]; then
            sed -i '/static.*key_pass/d' "$ROOT/certs/extract-cert.c"
            sed -i '1i __attribute__((unused)) static const char *key_pass;' "$ROOT/certs/extract-cert.c"
            echo "Patched certs/extract-cert.c for OpenSSL 3.0"
          fi
          echo "::endgroup::"

          echo "::group::1. Defconfig & Compile"

          MTIME_CACHE="$KERNEL_KIT/scripts/dynamic_mtime.sh"
          if [[ -f "$MTIME_CACHE" ]]; then
            chmod +x "$MTIME_CACHE"
            echo "::group::Restore File Timestamps (-t)"
            "$MTIME_CACHE" -t -d "$ROOT" -k kernel
            echo "::endgroup::"
          fi

          BUILD_CONFIG="$KERNEL_KIT/device/peridot-los23.2/build_config/build.config.peridot.los23.2"
          if [[ -f "$BUILD_CONFIG" ]]; then
            echo "Sourcing build config: $BUILD_CONFIG"
            set +u
            set -a
            source "$BUILD_CONFIG"
            set +a
            set -u
          else
            echo "::error::build.config not found!"
            exit 1
          fi

          if [[ -v CONFIGS_GKI ]]; then
            make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 "${CONFIGS_GKI[@]}"
          else
            make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          fi

          # --- DROIDSPACES PATCH ---
          echo "::group::Applying Droidspaces patch"
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" -o /tmp/droidspaces.patch
          patch -p1 -F 3 -i /tmp/droidspaces.patch
          echo "::endgroup::"

          # --- NET HUNTER & OTHER CONFIGS ---
          echo "::group::Applying NetHunter & Other Configs"
          ./scripts/config --file "$OUT/.config" \
            --set-str LOCALVERSION "-Lucy-Monitor" -d LOCALVERSION_AUTO -d WERROR \
            --set-val UCLAMP_BUCKETS_COUNT 20 -d TASK_DELAY_ACCT -d RSEQ -d SCHED_CLUSTER \
            -e SCHED_MC -e SCHED_HRTICK -e RT_SOFTIRQ_AWARE_SCHED -e RCU_BOOST -e RCU_LAZY \
            -e RCU_LAZY_DEFAULT_OFF -e BOEFFLA_WL_BLOCKER -e UNWIND_TABLES -e UNWIND_PATCH_PAC_INTO_SCS \
            -e DYNAMIC_SCS -d HZ_100 -e HZ_250 -d HZ_300 -d HZ_1000 --set-val HZ 250 \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN -e CFI_CLANG \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL \
            -m MI_HARDWARE_ID -m RFKILL -m CFG80211 -e NL80211_TESTMODE \
            -e CFG80211_REQUIRE_SIGNED_REGDB -e CFG80211_USE_KERNEL_REGDB_KEYS \
            -e CFG80211_DEFAULT_PS -d CFG80211_CRDA_SUPPORT -d CFG80211_WEXT -m MAC80211

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_BT_HCIBTUSB -e CONFIG_BT_HCIBTUSB_BCM -e CONFIG_BT_HCIBTUSB_RTL \
            -e CONFIG_BT_HCIVHCI -e CONFIG_BT_HCIBCM203X -e CONFIG_BT_HCIBPA10X -e CONFIG_BT_HCIBFUSB

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_USB_AIRSPY -e CONFIG_USB_HACKRF

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_CAN -e CONFIG_CAN_DEV -e CONFIG_CAN_CALC_BITTIMING -e CONFIG_CAN_LEDS \
            -e CONFIG_CAN_VCAN -e CONFIG_CAN_GRCAN -e CONFIG_CAN_XILINXCAN \
            -e CONFIG_CAN_C_CAN -e CONFIG_CAN_C_CAN_PLATFORM -e CONFIG_CAN_C_CAN_PCI \
            -e CONFIG_CAN_CC770 -e CONFIG_CAN_CC770_ISA -e CONFIG_CAN_CC770_PLATFORM \
            -e CONFIG_CAN_M_CAN -e CONFIG_CAN_M_CAN_PCI -e CONFIG_CAN_M_CAN_PLATFORM -e CONFIG_CAN_M_CAN_TCAN4X5X \
            -e CONFIG_CAN_HI311X -e CONFIG_CAN_MCP251X \
            -e CONFIG_CAN_8DEV_USB -e CONFIG_CAN_EMS_USB -e CONFIG_CAN_ESD_USB2 \
            -e CONFIG_CAN_GS_USB -e CONFIG_CAN_KVASER_USB -e CONFIG_CAN_PEAK_USB \
            -e CONFIG_NETLINK_DIAG -e CONFIG_VSOCKETS -e CONFIG_NET_SCHED -e CONFIG_NET_EMATCH_CANID

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_USB_SERIAL -e CONFIG_USB_SERIAL_CONSOLE -e CONFIG_USB_SERIAL_GENERIC \
            -e CONFIG_USB_SERIAL_CH341 -e CONFIG_USB_SERIAL_FTDI_SIO -e CONFIG_USB_SERIAL_PL2303

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_IP_NF_TARGET_TTL -e CONFIG_IP6_NF_TARGET_HL -e CONFIG_IP6_NF_MATCH_HL

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_IP_SET --set-val CONFIG_IP_SET_MAX 65534 \
            -e CONFIG_IP_SET_BITMAP_IP -e CONFIG_IP_SET_BITMAP_IPMAC -e CONFIG_IP_SET_BITMAP_PORT \
            -e CONFIG_IP_SET_HASH_IP -e CONFIG_IP_SET_HASH_IPMARK -e CONFIG_IP_SET_HASH_IPPORT \
            -e CONFIG_IP_SET_HASH_IPPORTIP -e CONFIG_IP_SET_HASH_IPPORTNET -e CONFIG_IP_SET_HASH_IPMAC \
            -e CONFIG_IP_SET_HASH_MAC -e CONFIG_IP_SET_HASH_NETPORTNET -e CONFIG_IP_SET_HASH_NET \
            -e CONFIG_IP_SET_HASH_NETNET -e CONFIG_IP_SET_HASH_NETPORT -e CONFIG_IP_SET_HASH_NETIFACE \
            -e CONFIG_IP_SET_LIST_SET

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_NET_SCH_FQ -e CONFIG_NET_SCH_FQ_CODEL -e CONFIG_NET_SCH_CAKE \
            -e CONFIG_NET_SCH_PIE -e CONFIG_NET_SCH_FQ_PIE

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_SYSVIPC -e CONFIG_POSIX_MQUEUE -e CONFIG_PID_NS -e CONFIG_IPC_NS -e CONFIG_USER_NS

          ./scripts/config --file "$OUT/.config" \
            -e CONFIG_DEVTMPFS -e CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            -e CONFIG_NETFILTER_XT_SET -e CONFIG_NETFILTER_XT_TARGET_REJECT \
            -e CONFIG_NETFILTER_XT_TARGET_LOG -e CONFIG_NETFILTER_XT_MATCH_RECENT
          echo "::endgroup::"

          # --- RTW88 MODULES ---
          echo "::group::Adding rtw88 modules"
          cd "$ROOT/drivers/net/wireless/realtek/"
          rm -rf rtw88
          git clone https://github.com/nullptr-t-oss/rtw88.git
          sed -i 's/$(CONFIG_RTW88)/m/g' Makefile
          sed -i '/^source "drivers\/net\/wireless\/realtek\/rtw88\/Kconfig"$/s/.*/ /' Kconfig
          cd "$ROOT"
          echo "::endgroup::"

          set +u
          if declare -f compile_system_dlkm_modules > /dev/null; then
            echo "Executing compile_system_dlkm_modules from build.config..."
            compile_system_dlkm_modules
          fi
          set -u

          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          if [[ -f "$MTIME_CACHE" ]]; then
            echo "::group::Find changes force recompilation (-u)"
            "$MTIME_CACHE" -u -d "$ROOT" -k kernel
            echo "::endgroup::"
          fi

          K_MAKE_FLAGS=("-j$(nproc --all)" "O=$OUT" "ARCH=arm64" "LLVM=1" "LLVM_IAS=1" "CC=ccache clang" "HOSTCC=ccache clang" "HOSTCXX=ccache clang++" "KCFLAGS=$WARN_FLAGS")
          if [[ -v MAKE_FLAGS ]]; then
             K_MAKE_FLAGS=("${MAKE_FLAGS[@]}")
          fi

          make "${K_MAKE_FLAGS[@]}" Image modules

          cp -f "$OUT/arch/arm64/boot/Image" "$DIST/Image-$FLAVOR"
          cp -f "$OUT/.config" "$DIST/config-$FLAVOR"

          make "${K_MAKE_FLAGS[@]}" INSTALL_MOD_PATH="$OUT/modules_staging" INSTALL_MOD_STRIP=1 modules_install
          cd "$OUT/modules_staging"
          UNAME=$(ls lib/modules/)
          depmod -b . "$UNAME"
          cd "$ROOT"
          
          echo "UNAME=$UNAME" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Delete Old Build Cache
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete "${{ env.CACHE_KEY_STATIC }}" || true

      - name: Save New Build Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OUT }}
          key: ${{ env.CACHE_KEY_STATIC }}

      - name: Build DLKMs & External Modules
        if: ${{ inputs.compile_dlkm == true || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          
          BUILD_CONFIG="$KERNEL_KIT/device/peridot-los23.2/build_config/build.config.peridot.los23.2"
          set +u
          source "$BUILD_CONFIG"
          set -u

          echo "::group::2. Build system_dlkm & vendor_dlkm (His Way)"
          if [[ -d "$KERNEL_KIT/bin/kernel/prebuilts/build-tools/linux_musl-x86/bin" ]]; then
            export PATH="$KERNEL_KIT/bin/kernel/prebuilts/build-tools/linux_musl-x86/bin:$PATH"
          elif [[ -d "$KERNEL_KIT/bin/kernel/prebuilts/build-tools/linux-x86/bin" ]]; then
            export PATH="$KERNEL_KIT/bin/kernel/prebuilts/build-tools/linux-x86/bin:$PATH"
          fi

          curl -sL https://android.googlesource.com/kernel/build/+/refs/heads/main/build_utils.sh?format=TEXT | base64 -d > "$ROOT/build_utils.sh"
          source "$ROOT/build_utils.sh"

          SYS_STAGE="$OUT/system_dlkm_staging"
          rm -rf "$SYS_STAGE" && mkdir -p "$SYS_STAGE/lib/modules/$UNAME"
          SYS_LIST="$KERNEL_KIT/device/peridot-los23.2/system_dlkm/system_dlkm.modules.include"
          if [[ -f "$SYS_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$SYS_STAGE/lib/modules/$UNAME/"
            done < "$SYS_LIST"
          fi
          cp "$OUT/modules_staging/lib/modules/$UNAME/modules."{alias,dep,softdep} "$SYS_STAGE/lib/modules/$UNAME/" 2>/dev/null || true

          system_dlkm_props_file="$(mktemp)"
          echo "system_dlkm_fs_type=ext4" >> "$system_dlkm_props_file"
          echo "use_dynamic_partition_size=true" >> "$system_dlkm_props_file"
          echo "ext_mkuserimg=mkuserimg_mke2fs" >> "$system_dlkm_props_file"
          echo "ext4_share_dup_blocks=true" >> "$system_dlkm_props_file"
          echo "extfs_rsv_pct=0" >> "$system_dlkm_props_file"
          echo "journal_size=0" >> "$system_dlkm_props_file"

          echo "Building system_dlkm with build_image..."
          build_image "$SYS_STAGE" "$system_dlkm_props_file" "$DIST/system_dlkm.img" /dev/null
          avbtool add_hashtree_footer --partition_name system_dlkm --hash_algorithm sha256 --image "$DIST/system_dlkm.img" --do_not_generate_fec

          VEND_STAGE="$OUT/vendor_dlkm_staging"
          rm -rf "$VEND_STAGE" && mkdir -p "$VEND_STAGE/lib/modules/$UNAME"
          VEND_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_dlkm/vendor_dlkm.modules.include"
          if [[ -f "$VEND_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$VEND_STAGE/lib/modules/$UNAME/"
            done < "$VEND_LIST"
          fi
          cp "$OUT/modules_staging/lib/modules/$UNAME/modules."{alias,dep,softdep} "$VEND_STAGE/lib/modules/$UNAME/" 2>/dev/null || true

          vendor_dlkm_props_file="$(mktemp)"
          echo "vendor_dlkm_fs_type=ext4" >> "$vendor_dlkm_props_file"
          echo "use_dynamic_partition_size=true" >> "$vendor_dlkm_props_file"
          echo "ext_mkuserimg=mkuserimg_mke2fs" >> "$vendor_dlkm_props_file"
          echo "ext4_share_dup_blocks=true" >> "$vendor_dlkm_props_file"

          echo "Building vendor_dlkm with build_image..."
          build_image "$VEND_STAGE" "$vendor_dlkm_props_file" "$DIST/vendor_dlkm.img" /dev/null
          avbtool add_hashtree_footer --partition_name vendor_dlkm --hash_algorithm sha256 --image "$DIST/vendor_dlkm.img" --do_not_generate_fec
          echo "::endgroup::"

          echo "::group::3. Compile External Modules (Following build.config order)"
          
          EXTRA_SYMBOLS=""

          for EXT_MOD in "${EXT_MODULES[@]}"; do
            EXT_MOD_ACTUAL=$(echo "$EXT_MOD" | sed "s/\.\${QCACLD_DEV_NAME}/.qca6750/")
            
            # Check if directory exists in our symlinked vendor tree
            if [[ ! -d "$ROOT/$EXT_MOD_ACTUAL" ]]; then
              echo "WARNING: The following module path does not exist : $EXT_MOD_ACTUAL" >&2
              continue
            fi
            
            echo "Building $EXT_MOD_ACTUAL..."
            
            if [[ "$EXT_MOD_ACTUAL" == *"qcacld-3.0"* ]]; then
              # WLAN Module
              TARGET_DIR="$ROOT/$EXT_MOD_ACTUAL"
              echo "Applying monitor mode configs to WLAN..."
              ln -sfn ../qca-wifi-host-cmn "$TARGET_DIR/cmn"
              for dcfg in "$TARGET_DIR/configs/"*qca6750* "$TARGET_DIR/configs/default_defconfig"; do
                [[ -f "$dcfg" ]] && { sed -i '/CONFIG_FEATURE_MONITOR_MODE_SUPPORT/d' "$dcfg"; echo "CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y" >> "$dcfg"; }
              done

              export KBUILD_EXTRA_SYMBOLS="$EXTRA_SYMBOLS"

              make -j$(nproc --all) -C "$ROOT" O="$OUT" M="$EXT_MOD_ACTUAL" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
                WLAN_ROOT="$TARGET_DIR" WLAN_COMMON_ROOT=cmn WLAN_COMMON_INC="$TARGET_DIR/cmn" \
                WLAN_FW_API="$TARGET_DIR/../fw-api/" CONFIG_ARCH_CLIFFS=y CONFIG_ARCH_QCOM=y \
                CONFIG_CNSS_OUT_OF_TREE=y CONFIG_IPA_OUT_OF_TREE=y CONFIG_QCA_WIFI_ISOC=0 \
                CONFIG_QCA_WIFI_2_0=1 WLAN_PROFILE=qca6750 CONFIG_QCA_CLD_WLAN_PROFILE=qca6750 \
                CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y DYNAMIC_SINGLE_CHIP=qca6750 DEVNAME=qca6750 \
                MODNAME=qca_cld3_qca6750 CONFIG_QCA_CLD_WLAN=m \
                KCFLAGS="$WARN_FLAGS -DFEATURE_MONITOR_MODE_SUPPORT -DCONFIG_FEATURE_MONITOR_MODE_SUPPORT=1" \
                modules 2>&1 | tee "$OUT/wlan_build.log"

              llvm-strip --strip-debug "$TARGET_DIR/qca_cld3_qca6750.ko"
            else
              # Other Modules
              CLEAN_PATH=$(echo "$EXT_MOD_ACTUAL" | sed 's|^\.\./vendor/||')
              
              make -j$(nproc --all) -C "$ROOT" O="$OUT" M="$EXT_MOD_ACTUAL" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
                CONFIG_ARCH_CLIFFS=y CONFIG_ARCH_QCOM=y \
                KCFLAGS="$WARN_FLAGS" \
                modules
                
              make -j$(nproc --all) -C "$ROOT" O="$OUT" M="$EXT_MOD_ACTUAL" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
                INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$OUT/modules_staging" INSTALL_MOD_DIR="extra/$CLEAN_PATH" \
                modules_install
            fi

            if [[ -f "$ROOT/$EXT_MOD_ACTUAL/Module.symvers" ]]; then
              EXTRA_SYMBOLS+=" $ROOT/$EXT_MOD_ACTUAL/Module.symvers"
            fi
          done
          echo "::endgroup::"

          echo "::group::4. Vendor Boot Image (His Way)"
          VB_RAMDISK_DIR="$OUT/vendor_boot_ramdisk"
          mkdir -p "$VB_RAMDISK_DIR/lib/modules/$UNAME"
          
          WLAN_MOD_PATH="$ROOT/../vendor/qcom/opensource/wlan/qcacld-3.0/qca_cld3_qca6750.ko"
          if [[ -f "$WLAN_MOD_PATH" ]]; then
            cp "$WLAN_MOD_PATH" "$VB_RAMDISK_DIR/lib/modules/$UNAME/"
          fi

          VB_LIST="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/vendor_boot.modules.include"
          if [[ -f "$VB_LIST" ]]; then
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -z "$mod" ]] && continue
              SRC_MOD=$(find "$OUT/modules_staging/lib/modules/$UNAME" -path "*$mod" -print -quit)
              [[ -n "$SRC_MOD" ]] && cp "$SRC_MOD" "$VB_RAMDISK_DIR/lib/modules/$UNAME/"
            done < "$VB_LIST"
          fi

          if [[ -d "$KERNEL_KIT/device/peridot-los23.2/vendor_boot/ramdisk" ]]; then
             cp -r "$KERNEL_KIT/device/peridot-los23.2/vendor_boot/ramdisk/"* "$VB_RAMDISK_DIR/"
          fi

          depmod -b "$VB_RAMDISK_DIR" "$UNAME"

          MKBOOTIMG_RAMDISK_CPIO="$DIST/ramdisk.cpio"
          mkbootfs "$VB_RAMDISK_DIR" > "$MKBOOTIMG_RAMDISK_CPIO"
          gzip -c -f "$MKBOOTIMG_RAMDISK_CPIO" > "$DIST/ramdisk.gz"

          DTB_FILE="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/dtb"
          BOOTCONFIG="$KERNEL_KIT/device/peridot-los23.2/vendor_boot/bootconfig"

          mkbootimg --header_version 4 \
            --vendor_cmdline "bootconfig" \
            --vendor_ramdisk "$DIST/ramdisk.gz" \
            --dtb "$DTB_FILE" \
            --vendor_bootconfig "$BOOTCONFIG" \
            --vendor_boot "$DIST/vendor_boot.img"

          avbtool add_hash_footer --partition_name vendor_boot --partition_size 100663296 --image "$DIST/vendor_boot.img" --algorithm SHA256_RSA4096 --key "$KERNEL_KIT/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem"
          echo "::endgroup::"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"

          echo "::group::5. Packaging Artifacts"
          STAGE="$(mktemp -d)"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$STAGE"
          rm -rf "$STAGE/.git"

          echo '#!/sbin/sh' > "$STAGE/anykernel.sh"
          echo 'properties() { ' >> "$STAGE/anykernel.sh"
          echo 'kernel.string=Lucy-Monitor' >> "$STAGE/anykernel.sh"
          echo 'do.devicecheck=1' >> "$STAGE/anykernel.sh"
          echo 'do.modules=0' >> "$STAGE/anykernel.sh"
          echo 'do.systemless=1' >> "$STAGE/anykernel.sh"
          echo 'do.cleanup=1' >> "$STAGE/anykernel.sh"
          echo 'do.cleanuponabort=0' >> "$STAGE/anykernel.sh"
          echo 'device.name1=peridot' >> "$STAGE/anykernel.sh"
          echo 'device.name2=pineapple' >> "$STAGE/anykernel.sh"
          echo 'device.name3=' >> "$STAGE/anykernel.sh"
          echo 'device.name4=' >> "$STAGE/anykernel.sh"
          echo 'device.name5=' >> "$STAGE/anykernel.sh"
          echo 'supported.versions=' >> "$STAGE/anykernel.sh"
          echo 'supported.patchlevels=' >> "$STAGE/anykernel.sh"
          echo '}; # end properties' >> "$STAGE/anykernel.sh"
          echo '' >> "$STAGE/anykernel.sh"
          echo '## AnyKernel methods (DO NOT CHANGE)' >> "$STAGE/anykernel.sh"
          echo '. $AKHOME/tools/ak3-core.sh' >> "$STAGE/anykernel.sh"
          echo '' >> "$STAGE/anykernel.sh"
          echo '## AnyKernel install' >> "$STAGE/anykernel.sh"
          echo 'dump_boot' >> "$STAGE/anykernel.sh"
          echo '' >> "$STAGE/anykernel.sh"
          echo '# Lucy WLAN module injection' >> "$STAGE/anykernel.sh"
          echo 'if [ -f "$AKHOME/qca_cld3_qca6750.ko" ]; then' >> "$STAGE/anykernel.sh"
          echo '    for Lucy_tgt in /vendor_dlkm/lib/modules/qca_cld3_qca6750.ko /vendor/lib/modules/qca_cld3_qca6750.ko; do' >> "$STAGE/anykernel.sh"
          echo '        Lucy_tdir=$(dirname "$Lucy_tgt")' >> "$STAGE/anykernel.sh"
          echo '        if [ -d "$Lucy_tdir" ]; then' >> "$STAGE/anykernel.sh"
          echo '            mount -o rw,remount "$(echo "$Lucy_tgt" | cut -d/ -f1-2)" 2>/dev/null || true' >> "$STAGE/anykernel.sh"
          echo '            cp -f "$AKHOME/qca_cld3_qca6750.ko" "$Lucy_tgt" 2>/dev/null && \' >> "$STAGE/anykernel.sh"
          echo '            { chmod 644 "$Lucy_tgt"; chown 0:0 "$Lucy_tgt"; restorecon "$Lucy_tgt" 2>/dev/null; break; }' >> "$STAGE/anykernel.sh"
          echo '        fi' >> "$STAGE/anykernel.sh"
          echo '    done' >> "$STAGE/anykernel.sh"
          echo 'fi' >> "$STAGE/anykernel.sh"
          echo '' >> "$STAGE/anykernel.sh"
          echo 'write_boot' >> "$STAGE/anykernel.sh"

          cp -f "$OUT/arch/arm64/boot/Image" "$STAGE/Image"
          
          WLAN_MOD_PATH="$ROOT/../vendor/qcom/opensource/wlan/qcacld-3.0/qca_cld3_qca6750.ko"
          if [[ -f "$WLAN_MOD_PATH" ]]; then
            cp -f "$WLAN_MOD_PATH" "$STAGE/"
          fi

          (cd "$STAGE" && zip -r9q "$DIST/Lucy-Monitor-${FLAVOR}-$(date -u +%Y%m%d)-$(cd "$ROOT" && git rev-parse --short=7 HEAD).zip" .)
          rm -rf "$STAGE"
          echo "::endgroup::"

      - name: Fetch NetHunter Wireless Firmware
        run: |
          mkdir -p dist
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/Magisk-Modules-Repo/wirelessFirmware/releases/latest/download/wirelessFirmware.zip" || \
          curl -sL -o dist/nethunter-wireless-firmware.zip "https://github.com/rithvikvibhu/nh-magisk-wifi-firmware/archive/refs/heads/master.zip"

      - name: Upload Build Artifacts (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-SM8635-Packages-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.img
            dist/Image-*
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ inputs.release_type == 'Release' || inputs.release_type == 'Pre-release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE_TAG="Lucy-peridot"
          LATEST_N=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' \
            | grep -E "^${BASE_TAG}-r[0-9]+$" \
            | grep -oE '[0-9]+$' \
            | sort -n | tail -n1 || true)

          if [ -z "${LATEST_N}" ]; then
            NEW_TAG="${BASE_TAG}-r0"
          else
            NEW_TAG="${BASE_TAG}-r$((LATEST_N + 1))"
          fi

          echo "Creating release: ${NEW_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          PRE_FLAG=""
          if [[ "${{ inputs.release_type }}" == "Pre-release" ]]; then
            PRE_FLAG="--prerelease"
          fi

          gh release create "${NEW_TAG}" \
            --repo "${{ github.repository }}" \
            --title "Lucy Monitor Kernel (${NEW_TAG})" \
            --notes "Automated build for POCO F6 (peridot). Includes Monitor Mode Wi-Fi support and NetHunter firmware." \
            ${PRE_FLAG}

          gh release upload "${NEW_TAG}" dist/*.zip dist/*.img --repo "${{ github.repository }}" --clobber

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-Build-Logs-Debug
          path: out/*.log
          if-no-files-found: ignore
